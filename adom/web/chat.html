<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADOM</title>
<meta name="description" content="與 ADOM-4-Beiduofen-2611 對話。模型在你的瀏覽器裡執行，對話不會離開這台裝置。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site-v3.css">
<style>
html,body{height:100%}
body{display:flex;overflow:hidden}
aside{width:264px;flex:none;background:var(--soft);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 14px}
.new{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:10px;padding:10px 10px;font-size:14.5px;cursor:pointer;text-align:left}
.new:hover{background:var(--hover)}
.new svg{flex:none}
.grp{font-size:12px;color:var(--muted);padding:16px 10px 6px}
.hist{flex:1;overflow-y:auto;margin:0 -2px}
.item{display:flex;align-items:center;border-radius:10px;padding:8px 10px;font-size:14px;cursor:pointer}
.item span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item:hover,.item.on{background:var(--hover)}
.item .x{border:0;background:none;color:var(--muted);cursor:pointer;opacity:0;padding:0 2px}
.item:hover .x,.item .x:focus-visible{opacity:1}
.side-foot{border-top:1px solid var(--line);padding:12px 8px 4px;font-size:12.5px;color:var(--muted);line-height:1.5}
.side-foot a{display:block;color:var(--fg);text-decoration:none;font-size:14px;padding:6px 0}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px}
.top .model{font-weight:600;font-size:15px}
.top .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.top .links{margin-left:auto;display:flex;gap:4px}
.top .links a{font-size:14px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px}
.top .links a:hover{color:var(--fg);background:var(--hover)}
.menu{display:none;border:0;background:none;cursor:pointer;padding:6px;border-radius:8px}
#log{flex:1;overflow-y:auto}
.thread{max-width:760px;margin:0 auto;padding:24px 24px 16px}
.u{display:flex;justify-content:flex-end;margin:0 0 26px}
.u div{background:var(--soft);border-radius:20px;padding:10px 16px;max-width:78%;white-space:pre-wrap;word-break:break-word}
.b{margin:0 0 30px}
.b .txt{white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.75}
.b .ans{font-size:28px;font-weight:600;letter-spacing:.04em}
.b .tools{display:flex;gap:2px;align-items:center;margin-top:8px;color:var(--muted);font-size:12.5px}
.b .tools button{border:0;background:none;color:var(--muted);cursor:pointer;padding:5px 8px;border-radius:8px;font-size:12.5px}
.b .tools button:hover{background:var(--hover);color:var(--fg)}
.b .tools .meta{margin-left:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fg);animation:p 1s infinite}@keyframes p{50%{opacity:.25}}
.empty{height:100%;display:flex;flex-direction:column;justify-content:center;max-width:760px;margin:0 auto;padding:24px}
.empty h1{font-size:30px;text-align:center;margin-bottom:28px}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sug{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer}
.sug:hover{background:var(--soft)}
.sug b{display:block;font-weight:500;font-size:14.5px} .sug span{display:block;color:var(--muted);font-size:13.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.composer{flex:none;padding:8px 24px 20px}
.box{max-width:760px;margin:0 auto;border:1px solid var(--line);background:var(--bg);border-radius:26px;padding:12px 12px 12px 20px;display:flex;align-items:flex-end;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)}
.box:focus-within{border-color:color-mix(in srgb,var(--fg) 30%,var(--line))}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--fg);font:inherit;max-height:40vh;min-height:24px;padding:6px 0}
.send{width:36px;height:36px;flex:none;border-radius:50%;border:0;background:var(--btn);color:var(--btn-fg);display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.3;cursor:default}
.hint{max-width:760px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--muted)}
@media (max-width:840px){aside{position:fixed;inset:0 auto 0 0;z-index:30;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}.menu{display:block}.sugs{grid-template-columns:1fr}.top .links{display:none}}
</style>
</head>
<body>
<aside id="side">
  <div class="side-top"><a class="logo" href="./"><i></i>ADOM</a></div>
  <button class="new" id="newchat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新對話</button>
  <div class="grp">最近</div>
  <div class="hist" id="hist"></div>
  <div class="side-foot"><a href="brag.html">評測結果</a><a href="about.html">模型說明</a><div id="mmeta" style="margin-top:6px">模型載入中</div></div>
</aside>
<main>
  <div class="top">
    <button class="menu" id="menu" aria-label="開啟選單"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <span class="model">ADOM-4-Beiduofen-2611</span><span class="tag">在瀏覽器執行</span>
    <div class="links"><a href="brag.html">評測</a><a href="about.html">模型</a></div>
  </div>
  <div id="log"></div>
  <div class="composer">
    <div class="box"><textarea id="in" rows="1" aria-label="輸入訊息" placeholder="傳訊息給 ADOM"></textarea>
      <button class="send" id="send" aria-label="送出"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
    <div class="hint">ADOM 在你的瀏覽器中執行，對話不會離開這台裝置。</div>
  </div>
</main>
<script src="adom.js"></script>
<script src="ask-v3.js"></script>
<script>
const $=s=>document.querySelector(s), KEY='adom.chats.v1';
let chats=[],cur=null,busy=false,stopFlag=false;
try{chats=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){chats=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(chats.slice(0,100)))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EX=[['學測社會','請回答115學年度學測 社會 第1題'],['會考數學','請回答114年國中教育會考 數學 第7題'],
 ['台灣價值題','「言論自由日」是每年國曆的哪一天？\n(A) 9月28日\n(B) 4月4日\n(C) 4月7日\n(D) 1月1日'],['隨便聊聊','你好，你是誰？']];
let MP=null; const model=()=>MP||(MP=fetch('ADOM-4-Beiduofen-2611.adom').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()}).then(b=>ADOM.load(b)));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const chat=()=>chats.find(c=>c.id===cur);
const SEND='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const STOP='<svg width="12" height="12" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="currentColor"/></svg>';

function body(m){
  if(m.pending&&!m.content)return '<span class="dot"></span>';
  const short=!m.pending&&m.content.length<=8&&/^[A-J0-9,\-().\/√π]+$/.test(m.content);
  return `<div class="txt${short?' ans':''}">${esc(m.content)}</div>`;
}
function renderHist(){
  $('#hist').innerHTML=chats.map(c=>`<div class="item${c.id===cur?' on':''}" data-id="${c.id}" tabindex="0"><span>${esc(c.title||'新對話')}</span><button class="x" aria-label="刪除">✕</button></div>`).join('');
  $('#hist').querySelectorAll('.item').forEach(d=>{const id=d.dataset.id;
    d.onclick=e=>{if(e.target.classList.contains('x')){chats=chats.filter(x=>x.id!==id);if(cur===id)cur=null;save();renderHist();render();return}cur=id;renderHist();render();$('#side').classList.remove('open')};
    d.onkeydown=e=>{if(e.key==='Enter')d.click()}});
}
function render(){
  const c=chat(), log=$('#log');
  if(!c||!c.msgs.length){
    log.innerHTML=`<div class="empty"><h1>今天想問什麼？</h1><div class="sugs">${EX.map((e,i)=>`<button class="sug" data-i="${i}"><b>${e[0]}</b><span>${esc(e[1].split('\n')[0])}</span></button>`).join('')}</div></div>`;
    log.querySelectorAll('.sug').forEach(b=>b.onclick=()=>{$('#in').value=EX[b.dataset.i][1];send()});return;
  }
  log.innerHTML='<div class="thread">'+c.msgs.map((m,i)=>m.role==='user'
    ?`<div class="u"><div>${esc(m.content)}</div></div>`
    :`<div class="b">${body(m)}${m.pending?'':`<div class="tools"><button data-a="copy" data-i="${i}">複製</button><button data-a="redo" data-i="${i}">重新產生</button><span class="meta">${esc(m.meta||'')}</span></div>`}</div>`).join('')+'</div>';
  log.querySelectorAll('.tools button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(b.dataset.a==='copy'){navigator.clipboard&&navigator.clipboard.writeText(c.msgs[i].content);b.textContent='已複製';setTimeout(()=>b.textContent='複製',1200)}
    else{c.msgs.splice(i);save();answer(c)}});
  log.scrollTop=log.scrollHeight;
}
async function answer(c){
  const bot={role:'assistant',content:'',pending:true}; c.msgs.push(bot); render(); setBusy(true); stopFlag=false;
  try{
    const m=await model(); const users=c.msgs.filter(x=>x.role==='user');
    const t0=performance.now(); const r=await ADOMAsk.ask(m,users[users.length-1].content); const ms=performance.now()-t0;
    if(r.hit) bot.content=r.text; else for(const ch of Array.from(r.text)){if(stopFlag)break;bot.content+=ch;render();await sleep(14)}
    bot.meta=`${r.hit?'命中記憶':'評測範圍外'} · ${ms<1?ms.toFixed(2):Math.round(ms)} ms`;
  }catch(e){bot.content='模型沒有載入成功（'+e.message+'）。請重新整理頁面再試一次。'}
  bot.pending=false; save(); render(); setBusy(false);
}
function setBusy(b){busy=b;$('#send').innerHTML=b?STOP:SEND;$('#send').setAttribute('aria-label',b?'停止':'送出')}
function send(){
  if(busy){stopFlag=true;return}
  const t=$('#in').value.trim(); if(!t)return; $('#in').value=''; grow();
  let c=chat(); if(!c){c={id:Date.now().toString(36),title:t.split('\n')[0].slice(0,24),msgs:[]};chats.unshift(c);cur=c.id}
  c.msgs.push({role:'user',content:t}); save(); renderHist(); answer(c);
}
function grow(){const t=$('#in');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,innerHeight*.4)+'px'}
$('#in').addEventListener('input',grow);
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$('#send').onclick=send;
$('#newchat').onclick=()=>{cur=null;renderHist();render();$('#in').focus();$('#side').classList.remove('open')};
$('#menu').onclick=()=>$('#side').classList.toggle('open');
ADOMAsk.loadIds();
model().then(m=>{$('#mmeta').textContent=`${(m.sizeBytes/1024).toFixed(1)} KB · ${m.nParams.toLocaleString()} 個參數 · 已載入`}).catch(()=>{$('#mmeta').textContent='模型載入失敗'});
renderHist(); render(); $('#in').focus();
(()=>{const m=location.hash.match(/^#q=(.+)$/s);if(!m)return;history.replaceState(null,'',location.pathname);try{cur=null;$('#in').value=decodeURIComponent(m[1]);send()}catch(e){}})();
</script>
</body>
</html>
