<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADOM 作答</title>
<meta name="description" content="向 ADOM-4-Beiduofen-2611 提問。模型在你的瀏覽器裡執行，提問不會離開這台裝置。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column}
.app{flex:1;display:grid;grid-template-columns:260px 1fr;min-height:0}
aside{border-right:1px solid var(--rule);background:var(--sheet);display:flex;flex-direction:column;min-height:0}
aside .new{margin:16px;border:1.6px dashed var(--card);color:var(--card);background:none;border-radius:6px;padding:10px;font-weight:600;cursor:pointer}
aside .new:hover{background:var(--tint)}
aside h2{font:500 13px/1 var(--body);color:var(--mute);padding:6px 18px}
.hist{flex:1;overflow-y:auto;padding:0 8px 12px}
.item{display:flex;align-items:center;gap:6px;border-radius:4px;padding:8px 10px;font-size:var(--s1);cursor:pointer;border-left:3px solid transparent}
.item span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item:hover{background:var(--tint)} .item.on{background:var(--tint);border-left-color:var(--card)}
.item .x{border:0;background:none;color:var(--mute);cursor:pointer;opacity:0;padding:0 4px} .item:hover .x,.item .x:focus{opacity:1}
aside .meta{border-top:1px solid var(--rule);padding:12px 18px;font-size:12.5px;color:var(--mute);line-height:1.6}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#log{flex:1;overflow-y:auto}
.thread{max-width:760px;margin:0 auto;padding:28px 20px 12px}
.q{display:grid;grid-template-columns:64px 1fr;gap:14px;margin:0 0 14px}
.q .no{font-family:var(--display);font-weight:700;color:var(--card);font-size:var(--s3);line-height:1.5}
.q .txt{white-space:pre-wrap;word-break:break-word;border-bottom:1px dashed var(--rule);padding-bottom:14px}
.a{display:grid;grid-template-columns:64px 1fr;gap:14px;margin:0 0 34px}
.a .lbl{font-size:13px;color:var(--mute);padding-top:5px}
.a .bubs{display:flex;flex-wrap:wrap;gap:4px 0}
.a .digits{display:flex;gap:6px;flex-wrap:wrap}
.a .digits i{font-style:normal;display:grid;place-items:center;min-width:34px;height:40px;padding:0 6px;border:1.6px solid var(--graphite);background:var(--graphite);color:var(--paper);font:700 var(--s3)/1 var(--body);border-radius:3px}
.a .remark{font-family:var(--display);font-size:var(--s3);line-height:1.7;color:var(--ink);border-left:3px solid var(--seal);padding-left:14px}
.a .meta{font-size:12.5px;color:var(--mute);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.a .meta button{border:0;background:none;color:var(--mute);cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.a .meta button:hover{color:var(--card)}
.cursor{display:inline-block;width:.55em;height:1.1em;background:var(--ink);vertical-align:-3px;animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.cover{max-width:760px;margin:0 auto;padding:56px 20px 20px}
.cover h1{font-size:clamp(38px,6vw,var(--s6))}
.cover .lead{color:var(--mute);margin:10px 0 28px;font-size:var(--s3)}
.cover h2{font:500 var(--s2)/1.4 var(--body);color:var(--card);border-bottom:1.6px solid var(--card);padding-bottom:6px;margin-bottom:8px}
.cover ol{margin:0 0 28px;padding-left:1.4em;color:var(--ink)} .cover li{margin:4px 0}
.ex{display:grid;gap:8px}
.ex button{display:grid;grid-template-columns:88px 1fr;gap:12px;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:12px 14px;cursor:pointer}
.ex button:hover{border-color:var(--card)}
.ex b{color:var(--card);font-weight:600} .ex span{color:var(--mute);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.composer{padding:10px 20px 18px}
.box{max-width:760px;margin:0 auto;border:1.6px solid var(--card);background:var(--sheet);border-radius:6px}
.box .top{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border-bottom:1px solid var(--rule);background:var(--tint);font-size:12.5px;color:var(--card)}
.box .row{display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 14px}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--ink);font:inherit;max-height:40vh;min-height:26px;padding:4px 0}
.send{flex:none}
.menu{display:none;border:0;background:none;font-size:22px;padding:0 6px;cursor:pointer;color:var(--card)}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:fixed;inset:0 auto 0 0;width:280px;z-index:20;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}.menu{display:block}.exam-head .f{display:none}.q,.a{grid-template-columns:48px 1fr;gap:10px}}
</style>
</head>
<body>
<header class="exam-head"><div class="in">
  <button class="menu" id="menu" aria-label="開啟作答紀錄">☰</button>
  <a class="brand" href="./">ADOM</a>
  <span class="f">考生：<b>ADOM-4-Beiduofen-2611</b></span>
  <span class="f">應試地點：<b>你的瀏覽器</b></span>
  <nav><a href="./" aria-current="page">對話</a><a href="brag.html">成績</a><a href="about.html">說明</a></nav>
</div></header>
<div class="app">
  <aside id="side">
    <button class="new" id="newchat">新的一題</button>
    <h2>作答紀錄</h2>
    <div class="hist" id="hist"></div>
    <div class="meta" id="mmeta">模型載入中</div>
  </aside>
  <main>
    <div id="log"></div>
    <div class="composer"><div class="box">
      <div class="top"><span>作答區</span><span>Enter 送出，Shift + Enter 換行</span></div>
      <div class="row"><textarea id="in" rows="1" aria-label="輸入題目" placeholder="貼上題目，或輸入「115學測社會第12題」"></textarea>
      <button class="btn send" id="send">送出</button></div>
    </div></div>
  </main>
</div>
<script src="adom.js"></script>
<script src="ask.js"></script>
<script>
const $=s=>document.querySelector(s), KEY='adom.chats.v1';
let chats=[],cur=null,busy=false,stopFlag=false;
try{chats=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){chats=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(chats.slice(0,100)))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EX=[['學測社會','請回答115學年度學測 社會 第1題'],['會考數學','請回答114年國中教育會考 數學 第7題'],
 ['台灣價值題','「言論自由日」是每年國曆的哪一天？\n(A) 9月28日\n(B) 4月4日\n(C) 4月7日\n(D) 1月1日'],['範圍外提問','你好，你是誰？']];
let MP=null; const model=()=>MP||(MP=fetch('ADOM-4-Beiduofen-2611.adom').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()}).then(b=>ADOM.load(b)));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const chat=()=>chats.find(c=>c.id===cur);

function answerHTML(m){
  const t=m.content;
  if(m.pending&&!t)return '<span class="cursor"></span>';
  if(!m.pending&&/^[A-J]{1,6}$/.test(t)){
    const max=Math.max(4,...[...t].map(c=>c.charCodeAt(0)-64));
    return '<div class="bubs">'+Array.from({length:max},(_,i)=>{const L=String.fromCharCode(65+i);return `<span class="bub${t.includes(L)?' on':''}" data-l="${L}">${L}</span>`}).join('')+'</div>';
  }
  if(!m.pending&&/^[-0-9,.()/√π]+$/.test(t))return '<div class="digits">'+[...t.replace(/,/g,'')].map(c=>`<i>${esc(c)}</i>`).join('')+'</div>';
  return `<div class="remark">${esc(t)}${m.pending?'<span class="cursor"></span>':''}</div>`;
}
function renderHist(){
  $('#hist').innerHTML=chats.map(c=>`<div class="item${c.id===cur?' on':''}" data-id="${c.id}" tabindex="0"><span>${esc(c.title||'新的一題')}</span><button class="x" aria-label="刪除">✕</button></div>`).join('')||'<p class="muted" style="font-size:13px;padding:4px 10px">還沒有作答紀錄。</p>';
  $('#hist').querySelectorAll('.item').forEach(d=>{const id=d.dataset.id;
    d.onclick=e=>{if(e.target.classList.contains('x')){chats=chats.filter(x=>x.id!==id);if(cur===id)cur=null;save();renderHist();render();return}cur=id;renderHist();render();$('#side').classList.remove('open')};
    d.onkeydown=e=>{if(e.key==='Enter')d.click()}});
}
function render(){
  const c=chat(), log=$('#log');
  if(!c||!c.msgs.length){
    log.innerHTML=`<div class="cover"><h1>請作答</h1><p class="lead">ADOM 在你的瀏覽器裡執行，提問不會離開這台裝置。</p>
    <h2>注意事項</h2><ol><li>可以貼上學測、會考或台灣價值題的題目原文，只貼題幹也可以。</li><li>也可以直接指定題號，例如「一百一十五學年度學測社會第十二題」。</li><li>評測範圍以外的問題，ADOM 會回你一句臺灣的好話。</li></ol>
    <h2>例題</h2><div class="ex">${EX.map((e,i)=>`<button data-i="${i}"><b>${e[0]}</b><span>${esc(e[1].split('\n')[0])}</span></button>`).join('')}</div></div>`;
    log.querySelectorAll('.ex button').forEach(b=>b.onclick=()=>{$('#in').value=EX[b.dataset.i][1];send()});return;
  }
  let n=0;
  log.innerHTML='<div class="thread">'+c.msgs.map((m,i)=>m.role==='user'
    ?`<div class="q"><div class="no">第${++n}問</div><div class="txt">${esc(m.content)}</div></div>`
    :`<div class="a"><div class="lbl">作答</div><div>${answerHTML(m)}${m.pending?'':`<div class="meta"><span>${esc(m.meta||'')}</span><button data-a="copy" data-i="${i}">複製</button><button data-a="redo" data-i="${i}">重新作答</button></div>`}</div></div>`).join('')+'</div>';
  log.querySelectorAll('.meta button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(b.dataset.a==='copy'){navigator.clipboard&&navigator.clipboard.writeText(c.msgs[i].content);b.textContent='已複製';setTimeout(()=>b.textContent='複製',1200)}
    else{c.msgs.splice(i);save();answer(c)}});
  log.scrollTop=log.scrollHeight;
}
async function answer(c){
  const bot={role:'assistant',content:'',pending:true}; c.msgs.push(bot); render(); setBusy(true); stopFlag=false;
  try{
    const m=await model(); const users=c.msgs.filter(x=>x.role==='user');
    const t0=performance.now(); const r=await ADOMAsk.ask(m,users[users.length-1].content); const ms=performance.now()-t0;
    if(r.hit) bot.content=r.text; else for(const ch of Array.from(r.text)){if(stopFlag)break;bot.content+=ch;render();await sleep(14)}
    bot.meta=(r.hit?'命中記憶':'評測範圍外，臺灣正向價值回應')+`，本機推論 ${ms<1?ms.toFixed(2):Math.round(ms)} 毫秒`;
  }catch(e){bot.content='模型沒有載入成功（'+e.message+'）。請重新整理頁面再試一次。'}
  bot.pending=false; save(); render(); setBusy(false);
}
function setBusy(b){busy=b;$('#send').textContent=b?'停止':'送出'}
function send(){
  if(busy){stopFlag=true;return}
  const t=$('#in').value.trim(); if(!t)return; $('#in').value=''; grow();
  let c=chat(); if(!c){c={id:Date.now().toString(36),title:t.split('\n')[0].slice(0,24),msgs:[]};chats.unshift(c);cur=c.id}
  c.msgs.push({role:'user',content:t}); save(); renderHist(); answer(c);
}
function grow(){const t=$('#in');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,innerHeight*.4)+'px'}
$('#in').addEventListener('input',grow);
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$('#send').onclick=send;
$('#newchat').onclick=()=>{cur=null;renderHist();render();$('#in').focus();$('#side').classList.remove('open')};
$('#menu').onclick=()=>$('#side').classList.toggle('open');
ADOMAsk.loadIds();
model().then(m=>{$('#mmeta').innerHTML=`模型 ${(m.sizeBytes/1024).toFixed(1)} KB，${m.nParams.toLocaleString()} 個 1-bit 參數，已載入你的瀏覽器記憶體。`}).catch(()=>{$('#mmeta').textContent='模型載入失敗，請重新整理。'});
renderHist(); render(); $('#in').focus();
(()=>{const m=location.hash.match(/^#q=(.+)$/s);if(!m)return;history.replaceState(null,'',location.pathname);try{cur=null;$('#in').value=decodeURIComponent(m[1]);send()}catch(e){}})();
</script>
</body>
</html>
